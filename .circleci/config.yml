version: 2.1

jobs:
  verify-release-tag:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - run:
          name: Vérifier que le tag appartient à main
          command: |
            set -Eeuo pipefail

            if ! printf '%s' "$CIRCLE_TAG" |
              grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            then
              echo "Tag invalide : $CIRCLE_TAG"
              exit 1
            fi

            git fetch \
              --no-tags \
              origin \
              main:refs/remotes/origin/main

            if ! git merge-base \
              --is-ancestor \
              "$CIRCLE_SHA1" \
              refs/remotes/origin/main
            then
              echo "Le commit tagué n'appartient pas à main"
              exit 1
            fi

            echo "Tag $CIRCLE_TAG valide"

  test-backend:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout

      - restore_cache:
          keys:
            - go-v1-{{ checksum "backend/go.sum" }}

      - run:
          name: Télécharger les dépendances Go
          command: |
            cd backend
            go mod download

      - save_cache:
          key: go-v1-{{ checksum "backend/go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

      - run:
          name: Tests et analyse Go
          command: |
            cd backend
            go test ./...
            go vet ./...

  test-frontend:
    docker:
      - image: cimg/node:24.13
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "frontend/package-lock.json" }}

      - run:
          name: Installer les dépendances
          command: |
            cd frontend
            npm ci

      - save_cache:
          key: npm-v1-{{ checksum "frontend/package-lock.json" }}
          paths:
            - /home/circleci/.npm

      - run:
          name: Tester et construire le frontend
          command: |
            cd frontend
            npm test
            npm run check
            npm run build

  test-firmware:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - platformio-v1-{{ checksum "firmware/platformio.ini" }}
      - run:
          name: Installer PlatformIO
          command: pip install --user "platformio==6.2.0"
      - save_cache:
          key: platformio-v1-{{ checksum "firmware/platformio.ini" }}
          paths:
            - /home/circleci/.platformio
      - run:
          name: Tester et compiler le firmware ESP32-S2
          command: |
            ~/.local/bin/pio test -d firmware -e native
            ~/.local/bin/pio run -d firmware -e esp32s2

  build-and-push:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Connexion à GHCR
          command: |
            echo "$GHCR_TOKEN" |
              docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

      - run:
          name: Build des images
          command: |
            set -Eeuo pipefail

            backend="ghcr.io/yassine-re/partybox-backend"
            frontend="ghcr.io/yassine-re/partybox-frontend"

            docker build \
              --pull \
              --file backend/Dockerfile \
              --tag "${backend}:${CIRCLE_TAG}" \
              --tag "${backend}:sha-${CIRCLE_SHA1}" \
              .

            docker build \
              --pull \
              --file frontend/Dockerfile \
              --tag "${frontend}:${CIRCLE_TAG}" \
              --tag "${frontend}:sha-${CIRCLE_SHA1}" \
              .

      - run:
          name: Publication dans GHCR
          command: |
            set -Eeuo pipefail

            backend="ghcr.io/yassine-re/partybox-backend"
            frontend="ghcr.io/yassine-re/partybox-frontend"

            docker push "${backend}:${CIRCLE_TAG}"
            docker push "${backend}:sha-${CIRCLE_SHA1}"
            docker push "${frontend}:${CIRCLE_TAG}"
            docker push "${frontend}:sha-${CIRCLE_SHA1}"

  deploy-azure:
    machine: true
    resource_class: partybox/azure-vm
    environment:
      PARTYBOX_APP_DIR: /home/partybox/partybox
    steps:
      - checkout

      - run:
          name: Déployer sur la VM Azure
          command: |
            set -Eeuo pipefail

            : "${PARTYBOX_APP_DIR:?PARTYBOX_APP_DIR est absent}"

            ./infra/deploy.sh "$CIRCLE_TAG"

  verify-production:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Vérifier le site public
          command: |
            set -Eeuo pipefail
            : "${PUBLIC_URL:?PUBLIC_URL est absent}"
            curl \
              --fail \
              --show-error \
              --retry 12 \
              --retry-delay 5 \
              "${PUBLIC_URL}/api/health"

workflows:
  ci:
    jobs:
      - test-backend
      - test-frontend
      - test-firmware

  release:
    jobs:
      - verify-release-tag:
          filters: &release-filter >
            pipeline.git.tag matches
            /^v[0-9]+\.[0-9]+\.[0-9]+$/

      - test-backend:
          requires:
            - verify-release-tag
          filters: *release-filter

      - test-frontend:
          requires:
            - verify-release-tag
          filters: *release-filter

      - test-firmware:
          requires:
            - verify-release-tag
          filters: *release-filter

      - build-and-push:
          requires:
            - test-backend
            - test-frontend
            - test-firmware
          context:
            - partybox-ghcr
          filters: *release-filter

      - approve-production:
          type: approval
          requires:
            - build-and-push
          filters: *release-filter

      - deploy-azure:
          requires:
            - approve-production
          filters: *release-filter

      - verify-production:
          requires:
            - deploy-azure
          context:
            - partybox-public-health
          filters: *release-filter
