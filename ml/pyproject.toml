[project]
name = "partybox-ml"
version = "0.0.0"
description = "Pipeline de ranking contextuel des missions PartyBox"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
