[platformio]
default_envs = esp32s2

[env:esp32s2]
platform = espressif32@6.12.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
lib_deps = bblanchon/ArduinoJson@^7.4.2
build_flags = -D PARTYBOX_FIRMWARE_VERSION=\"1.0.0\"

[env:esp32s2-serial]
extends = env:esp32s2
build_flags = ${env:esp32s2.build_flags} -D PARTYBOX_NETWORK_ENABLED=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<reaction_game.cpp> +<button.cpp>
